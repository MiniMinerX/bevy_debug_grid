[package]
name = "bevy_debug_grid"
description = "A bevy plugin for creating grids, for debugging purposes"
version = "0.8.0"
repository = "https://github.com/romenjelly/bevy_debug_grid"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]
exclude = ["/examples/", "/assets/"]

[dependencies]
bevy = { version = "0.17.0-dev", git = "https://github.com/bevyengine/bevy.git", default-features = false, features = [
    "bevy_render",
    "bevy_pbr",
    "bevy_asset",
] }

[dev-dependencies]
bevy = { version = "0.17.0-dev", git = "https://github.com/bevyengine/bevy.git"}
bevy_spectator = { git = "https://github.com/MiniMinerX/bevy_spectator", branch = "dev-0.17"}

[[example]]
name = "default_cube"
path = "examples/default_cube.rs"

[[example]]
name = "moving_grid"
path = "examples/moving_grid.rs"

[[example]]
name = "changing_grid"
path = "examples/changing_grid.rs"

[[example]]
name = "changing_grid_axis"
path = "examples/changing_grid_axis.rs"

[[example]]
name = "dynamic_floor_grid"
path = "examples/dynamic_floor_grid.rs"

[[example]]
name = "render_layers"
path = "examples/render_layers.rs"
